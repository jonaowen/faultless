<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flawless French</title><meta name="robots" content="noindex">
<meta http-equiv="refresh" content="2;url=../">
<style>body{margin:0;background:#F7F2E8;color:#1B2433;font:18px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center;padding:0 16px}a{color:#1F6FD6}</style>
</head><body><p>The new Flawless French is now the app itself.<br><a href="../">Open it</a></p>
<script>
/* The preview that was here is now the app at the site's root. Its service worker (scope next/) and its kept copy are removed, then the
   visitor goes to the app. The learners' places are not here: the app reads them where they have always been. */
(async()=>{ try{ if(navigator.serviceWorker){ for(const r of await navigator.serviceWorker.getRegistrations()) if(/\/next\/$/.test(new URL(r.scope).pathname)) await r.unregister(); } }catch(e){}
  try{ for(const k of await caches.keys()) if(k.startsWith("faultless-next-")) await caches.delete(k); }catch(e){}
  location.replace("../"); })();
</script></body></html>
