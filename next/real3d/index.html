<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Faultless French: real figures (prototype)</title>
<style>
@font-face { font-family: "Atkinson Hyperlegible Next"; src: url("../fonts/atkinson-next-latin.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
:root { --paper: #F7F2E8; --card: #FFFDF8; --ink: #24303d; --marie: #2E4A6B; --pierre: #3F6FB5; --sylvie: #C0453B; --you: #5AA86D; --gold: #E8C97A; --frame: #C7473C; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: "Atkinson Hyperlegible Next", system-ui, sans-serif; overflow: hidden; }
#phone { position: relative; width: 100vw; max-width: 430px; height: 100vh; margin: 0 auto; overflow: hidden; background: var(--paper); }
#top { position: absolute; left: 0; right: 0; top: 0; height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 22px; }
#top .x { width: 22px; height: 22px; position: relative; }
#top .x::before, #top .x::after { content: ""; position: absolute; left: 10px; top: -1px; width: 2.5px; height: 24px; background: var(--marie); border-radius: 2px; transform: rotate(45deg); }
#top .x::after { transform: rotate(-45deg); }
#top .bar { flex: 1; height: 10px; border-radius: 6px; background: #e6dccb; position: relative; }
#top .bar i { position: absolute; left: 0; top: -6px; width: 22px; height: 22px; border-radius: 50%; background: #F2B33D; box-shadow: 0 0 0 3px var(--card), 0 1px 3px rgba(60,40,20,.3); }
#stage { position: absolute; left: 0; top: 64px; width: 100%; aspect-ratio: 400 / 700; overflow: hidden; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.card { position: absolute; width: 38.5%; aspect-ratio: 160 / 190; border-radius: 14px; background: var(--card);
  box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 2px 1px rgba(80,60,30,.10), 4px 10px 18px -6px rgba(80,60,30,.28); overflow: hidden; }
.card canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#cardP { left: 9%; top: 11.5%; }
#cardS { left: 52.5%; top: 11.5%; }
.card.lit { box-shadow: 0 0 0 4px var(--gold), 0 3px 2px rgba(80,60,30,.12), 6px 16px 22px -6px rgba(80,60,30,.32); transform: translateY(-3px); }
#cardL { width: 80px; height: 95px; left: auto; right: 10px; top: 41%; border-radius: 10px; }
#big { position: absolute; left: 50%; top: 18%; width: 270px; height: 320px; margin-left: -135px; display: none; border-radius: 18px; z-index: 5; }
body.large #big { display: block; }
#ui { position: absolute; left: 0; right: 0; bottom: 0; height: 104px; padding: 8px 8px 10px; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start;
  background: linear-gradient(to top, rgba(247,242,232,.97) 70%, rgba(247,242,232,0)); z-index: 6; }
#ui button { font: 600 13px/1 "Atkinson Hyperlegible Next", system-ui, sans-serif; color: var(--marie); background: var(--card); border: 1px solid #ddd2bf; border-radius: 16px; padding: 7px 10px; }
#ui button:active { transform: translateY(1px); }
#ui button.alt { color: #2c6b3c; border-color: #bfd8c4; }
#load { position: absolute; inset: 0; display: grid; place-items: center; color: #8a7b66; font-size: 15px; z-index: 9; background: var(--paper); transition: opacity .4s; }
body.ready #load { opacity: 0; pointer-events: none; }
body.bare .card, body.bare #ui { visibility: hidden; }
body[data-error] #load::after { content: attr(data-error); }
</style>
</head>
<body>
<div id="phone">
  <div id="top"><div class="x"></div><div class="bar"><i></i></div></div>
  <div id="stage">
    <canvas id="gl"></canvas>
    <div class="card" id="cardP"><canvas id="pcP"></canvas></div>
    <div class="card" id="cardS"><canvas id="pcS"></canvas></div>
    <div class="card" id="cardL"><canvas id="lc"></canvas></div>
    <div class="card" id="big"><canvas id="lcBig"></canvas></div>
  </div>
  <div id="ui">
    <button data-g="rest">Rest</button>
    <button data-g="speak">Speak</button>
    <button data-g="ecoute">Écoute</button>
    <button data-g="atoi">À toi</button>
    <button data-g="avecmoi">Avec moi</button>
    <button data-g="point" data-a="cardP">Point: Pierre</button>
    <button data-g="point" data-a="cardS">Point: Sylvie</button>
    <button data-g="nod">Nod</button>
    <button data-g="smile">Smile</button>
    <button data-g="script">Script</button>
    <button class="alt" data-l="dance">Dance</button>
    <button class="alt" data-l="jump">Jump</button>
    <button class="alt" id="bigBtn">Large</button>
  </div>
  <div id="load">Loading…</div>
</div>
<script type="module" src="real3d.js"></script>
</body>
</html>
