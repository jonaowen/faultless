<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Faultless</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4f1ea">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f1ea; --ink:#22252b; --muted:#6b7079; --frame:#ffffff; --frame-line:#d9d3c7;
  --go:#1fa855; --idle:#d9d3c7; --skin:#e9b996; --skin-d:#d49f7a;
  --tutor-top:#3d5a73; --tutor-hair:#b5652f; --paul-top:#3f6fb5; --paul-hair:#6b4a2f;
  --julie-top:#c0453b; --julie-hair:#2a1f1a; --panel:#ffffff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#signal{position:fixed;inset:0;pointer-events:none;border:14px solid #7a5434;transition:border-color .12s;z-index:20}
#signal.on{border-color:var(--go)}
#flag{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));right:calc(66px + env(safe-area-inset-right,0px));z-index:40;width:40px;height:40px;border-radius:50%;border:1px solid var(--frame-line);background:var(--panel);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.75}
#flag.hit{background:#f3d36b;opacity:1}
.gtalk .lb>*{animation:bob .28s infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
svg#scene{width:min(100vw,56vh);height:auto;max-height:100vh;display:block}
.limb{transition:transform .35s cubic-bezier(.3,.7,.3,1);transform-box:view-box}
.fade{transition:opacity .25s}
#mouth{transition:ry .08s}
.talk #mouth{animation:talk .22s infinite alternate}
@keyframes talk{from{ry:2}to{ry:7}}
#play{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;background:rgba(244,241,234,.86)}
#play button{width:128px;height:128px;border-radius:50%;border:0;background:var(--go);box-shadow:0 8px 24px rgba(0,0,0,.18);cursor:pointer;display:flex;align-items:center;justify-content:center}
#play button svg{width:56px;height:56px;margin-left:8px}
#play[hidden]{display:none}
#gender{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:28px;z-index:35;background:var(--bg)}
#gender[hidden]{display:none}
#gender button{width:132px;height:170px;border-radius:20px;border:2px solid var(--frame-line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
#gender button:focus-visible,#gender button:hover{border-color:var(--go)}
#gear{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));right:calc(18px + env(safe-area-inset-right,0px));z-index:40;width:40px;height:40px;border-radius:50%;border:1px solid var(--frame-line);background:var(--panel);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.75}
#caption{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(34,37,43,.82);color:#fff;padding:6px 14px;border-radius:8px;font-size:17px;z-index:25;max-width:90vw;text-align:center}
#caption[hidden]{display:none}
#manual{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:26;display:flex;gap:10px;align-items:center;background:var(--panel);padding:10px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
#manual[hidden]{display:none}
#manual input{font-size:16px;padding:8px;border:1px solid var(--frame-line);border-radius:8px;width:180px}
#manual button{font-size:20px;width:46px;height:46px;border-radius:10px;border:1px solid var(--frame-line);background:#fff;cursor:pointer}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:var(--panel);z-index:50;box-shadow:-8px 0 24px rgba(0,0,0,.15);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 24px;font-size:14px}
#panel[hidden]{display:none}
#panel h2{font-size:16px;margin:0 0 4px}
#panel h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 6px}
#panel .row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
#panel button{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--frame-line);background:#fff;cursor:pointer}
#panel table{border-collapse:collapse;width:100%;font-size:12.5px}
#panel td,#panel th{border-bottom:1px solid #eee;padding:4px 4px;text-align:left;vertical-align:top}
#panel .ok{color:#1d7a3e}#panel .bad{color:#b3261e}
#panel select,#panel input[type=range]{max-width:100%}
.note{color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<div id="stage">
<svg id="scene" viewBox="0 0 400 700" aria-hidden="true">
  <!-- classroom floor (group scene only) -->
  <g id="floor" class="fade" opacity="0">
    <rect x="0" y="0" width="400" height="700" fill="#ebe5d8"/>
    <rect x="0" y="300" width="400" height="400" fill="#d9cfbd"/>
  </g>
  <g id="room" style="transform-box:view-box;transform-origin:0 0;transition:transform .9s ease-in-out;transform:translate(0px,40px) scale(1)">
  <!-- portrait frames -->
  <g id="frames">
    <g id="frameL" transform="translate(28,24)">
      <rect width="160" height="190" rx="14" fill="var(--frame)" stroke="var(--frame-line)" stroke-width="2"/>
      <g class="fade" id="slotL"></g>
    </g>
    <g id="frameR" transform="translate(212,24)">
      <rect width="160" height="190" rx="14" fill="var(--frame)" stroke="var(--frame-line)" stroke-width="2"/>
      <g class="fade" id="slotR"></g>
    </g>
  </g>
  <!-- tutor, seated -->
  <g id="tutor">
    <rect x="112" y="300" width="176" height="300" rx="26" fill="#7b5a43"/>
    <!-- back hair -->
    <path d="M150 330 q0-75 50-78 q50 3 50 78 q0 40-8 60 h-84 q-8-20-8-60z" fill="var(--tutor-hair)"/>
    <!-- torso -->
    <path d="M118 600 v-120 q0-52 52-60 h60 q52 8 52 60 v120z" fill="var(--tutor-top)"/>
    <rect x="186" y="398" width="28" height="26" fill="var(--skin-d)"/>
    <!-- head -->
    <ellipse cx="200" cy="352" rx="42" ry="50" fill="var(--skin)"/>
    <path d="M158 345 q2-52 42-54 q40 2 42 54 q-14-26-42-30 q-28 4-42 30z" fill="var(--tutor-hair)"/>
    <ellipse cx="184" cy="352" rx="4" ry="5" fill="var(--ink)"/>
    <ellipse cx="216" cy="352" rx="4" ry="5" fill="var(--ink)"/>
    <path d="M176 340 q8-5 16 0 M208 340 q8-5 16 0" stroke="var(--tutor-hair)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M200 358 q-3 10 0 14" stroke="var(--skin-d)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <ellipse id="mouth" cx="200" cy="384" rx="10" ry="2" fill="#8a3b3b"/>
    <!-- ear-cup hand (Écoute) -->
    <g id="earHand" class="fade" opacity="0">
      <path d="M244 330 q22 4 22 28 q0 22-20 26 q-10-24-2-54z" fill="var(--skin)" stroke="var(--skin-d)" stroke-width="2"/>
      <path d="M276 330 q12 22 0 44 M288 322 q18 30 0 60" stroke="var(--muted)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M258 384 l14 96" stroke="var(--tutor-top)" stroke-width="22" stroke-linecap="round"/>
    </g>
    <!-- open palm (À toi) -->
    <g id="palm" class="fade" opacity="0">
      <path d="M200 470 l0 30" stroke="var(--tutor-top)" stroke-width="22" stroke-linecap="round"/>
      <g transform="translate(200,456)">
        <ellipse cx="0" cy="0" rx="26" ry="30" fill="var(--skin)" stroke="var(--skin-d)" stroke-width="2"/>
        <g stroke="var(--skin-d)" stroke-width="2" fill="var(--skin)">
          <rect x="-24" y="-58" width="11" height="34" rx="5.5"/>
          <rect x="-11" y="-66" width="11" height="40" rx="5.5"/>
          <rect x="2" y="-64" width="11" height="38" rx="5.5"/>
          <rect x="15" y="-54" width="10" height="30" rx="5"/>
          <rect x="22" y="-14" width="22" height="11" rx="5.5" transform="rotate(-30 22 -14)"/>
        </g>
      </g>
    </g>
    <!-- right arm (viewer's left) -->
    <g id="armL" class="limb" style="transform-origin:150px 440px">
      <path d="M150 440 L150 580" stroke="var(--tutor-top)" stroke-width="24" stroke-linecap="round"/>
      <g id="handL" transform="translate(150,592)">
        <circle r="13" fill="var(--skin)" stroke="var(--skin-d)" stroke-width="2"/>
        <rect class="finger" x="-4" y="6" width="8" height="26" rx="4" fill="var(--skin)" stroke="var(--skin-d)" stroke-width="2"/>
        <rect class="thumb" x="-4.5" y="4" width="9" height="24" rx="4.5" fill="var(--skin)" stroke="var(--skin-d)" stroke-width="2" opacity="0" transform="rotate(30)"/>
      </g>
    </g>
    <!-- left arm (viewer's right) -->
    <g id="armR" class="limb" style="transform-origin:250px 440px">
      <path d="M250 440 L250 580" stroke="var(--tutor-top)" stroke-width="24" stroke-linecap="round"/>
      <g id="handR" transform="translate(250,592)">
        <circle r="13" fill="var(--skin)" stroke="var(--skin-d)" stroke-width="2"/>
        <rect class="finger" x="-4" y="6" width="8" height="26" rx="4" fill="var(--skin)" stroke="var(--skin-d)" stroke-width="2"/>
      </g>
    </g>
  </g>
  </g><!-- /room -->
  <!-- the model learner, seen from behind, facing the teacher (classroom scene only) -->
  <g id="classroom" class="fade" opacity="0">
    <rect id="mlGlow" class="fade" opacity="0" x="122" y="531" width="156" height="200" rx="30" fill="none" stroke="var(--go)" stroke-width="12"/>
    <g class="lb" transform="translate(200,585)"><rect x="-58" y="48" width="116" height="120" rx="12" fill="#5b4636"/><path d="M-66 170 v-70 q0-46 50-54 h32 q50 8 50 54 v70z" fill="#6a8f5a"/><circle r="42" cy="0" fill="#c98f6b"/><path d="M-42 6 q-2-50 42-52 q44 2 42 52 q-8 12-42 14 q-34-2-42-14z" fill="#2f2620"/></g>
  </g>
  <!-- restart and delayed-test symbols (no words) -->
  <g id="icoRestart" class="fade" opacity="0">
    <circle cx="200" cy="120" r="54" fill="#fff" stroke="var(--frame-line)" stroke-width="2"/>
    <path d="M226 106 a30 30 0 1 0 4 26" stroke="var(--tutor-top)" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M214 92 l20 12 l-20 12z" fill="var(--tutor-top)"/>
  </g>
  <g id="icoBookmark" class="fade" opacity="0">
    <circle cx="200" cy="120" r="54" fill="#fff" stroke="var(--frame-line)" stroke-width="2"/>
    <path d="M180 88 h40 v66 l-20 -16 l-20 16z" fill="#d9822b"/>
  </g>
  <!-- end-of-exercise tick -->
  <g id="tick" class="fade" opacity="0">
    <circle cx="200" cy="120" r="58" fill="var(--go)"/>
    <path d="M172 122 l20 20 l38 -42" stroke="#fff" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
</div>
<div id="signal"></div>
<div id="caption" hidden></div>
<div id="manual" hidden>
  <input id="manualText" placeholder="typed answer" autocomplete="off">
  <button id="manualSend" title="Judge typed answer">↵</button>
  <button id="manualOk" title="Count as correct">✓</button>
  <button id="manualBad" title="Count as wrong">✗</button>
</div>
<div id="gender" hidden>
  <button id="gM" aria-label="homme"><svg width="96" height="150" viewBox="0 0 96 150"><circle cx="48" cy="16" r="13" fill="#2b2f36"/><rect x="30" y="34" width="36" height="52" rx="8" fill="#2b2f36"/><rect x="18" y="34" width="10" height="46" rx="5" fill="#2b2f36"/><rect x="68" y="34" width="10" height="46" rx="5" fill="#2b2f36"/><rect x="31" y="84" width="15" height="62" rx="6" fill="#2b2f36"/><rect x="50" y="84" width="15" height="62" rx="6" fill="#2b2f36"/></svg></button>
  <button id="gF" aria-label="femme"><svg width="96" height="150" viewBox="0 0 96 150"><circle cx="48" cy="16" r="13" fill="#2b2f36"/><path d="M38 34 h20 q6 0 8 6 l18 56 h-72 l18 -56 q2 -6 8 -6z" fill="#2b2f36"/><rect x="35" y="94" width="11" height="52" rx="5" fill="#2b2f36"/><rect x="50" y="94" width="11" height="52" rx="5" fill="#2b2f36"/></svg></button>
</div>
<div id="play"><button id="playBtn" aria-label="Commencer"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" fill="#fff"/></svg></button></div>
<button id="flag" aria-label="Tester flag"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M5 22V3h11l-1.5 4L16 11H7v11z" fill="#6b7079"/></svg></button>
<button id="gear" aria-label="Tester panel"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#6b7079" d="M12 8.5a3.5 3.5 0 100 7 3.5 3.5 0 000-7zm8.6 4.4l1.9 1.5-2 3.4-2.3-.9c-.6.5-1.2.8-1.9 1.1l-.3 2.4h-4l-.3-2.4c-.7-.3-1.3-.6-1.9-1.1l-2.3.9-2-3.4 1.9-1.5a7 7 0 010-2.2L1.6 8.6l2-3.4 2.3.9c.6-.5 1.2-.8 1.9-1.1L8.1 2.6h4l.3 2.4c.7.3 1.3.6 1.9 1.1l2.3-.9 2 3.4-1.9 1.5a7 7 0 010 2.2z"/></svg></button>

<aside id="panel" hidden>
  <div class="row" style="justify-content:space-between"><h2>Tester panel</h2><button id="closePanel">Close</button></div>
  <div class="note" id="status"></div>
  <h3>Settings</h3>
  <div class="row"><label><input type="checkbox" id="optCaption"> Show French text (testing only)</label></div>
  <div class="row"><label><input type="checkbox" id="optManual"> Manual mode (no microphone: type or tick answers)</label></div>
  <div class="row">Learner's gender <select id="optGender"><option value="m">Man</option><option value="f">Woman</option></select></div>
  <div class="row">Voice <select id="optVoice"></select></div>
  <div class="row">Pause between units <input type="range" id="optPause" min="150" max="1200" step="50"> <span id="pauseVal"></span> ms</div>
  <div class="row">Speech rate <input type="range" id="optRate" min="0.6" max="1.2" step="0.05"> <span id="rateVal"></span></div>
  <h3>Progress</h3>
  <div id="progress" class="note"></div>
  <div class="row">
    <button id="btnRestartEx">Restart exercise</button>
    <button id="btnDelayed">Run pending delayed tests</button>
    <button id="btnReset">Reset all progress</button>
    <button id="btnDownload">Download log</button>
  </div>
  <h3>First-time correct</h3>
  <div id="ftc"></div>
  <h3>Pending delayed tests</h3>
  <div id="delayedList" class="note"></div>
  <h3>Every response (newest first)</h3>
  <div class="note">Every incorrect response is a programme fault (ruling P11). "Heard" is what the speech recogniser wrote down.</div>
  <div id="log"></div>
</aside>

<script>
"use strict";
/* Self-update: GitHub Pages lets phones keep a page for up to 10 minutes, and home-screen apps
   longer. On every open, ask the server for the current version, bypassing the cache, and reload
   onto it if this copy is older. */
const APP_VERSION="2026-11-08.2";
(function checkVersion(){
  try{
    fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{
      if(j && j.version && j.version!==APP_VERSION && !location.search.includes("v="+j.version)){
        location.replace(location.pathname+"?v="+encodeURIComponent(j.version));
      }
    }).catch(()=>{});
  }catch(e){}
})();
const $=id=>document.getElementById(id);
let READY=false;
/* ============================================================
   CONTENT — Lesson 1, Exercise 1 (C'est qui ?)
   Units are spoken separately with a pause between them; an
   elision or liaison unit (C'est) is never split.
   ============================================================ */
const PEOPLE = {
  paul:  {name:"Paul",  accept:["paul","pol","paule","pôle","pole","pool","paulo","pull","pour"]},
  julie: {name:"Julie", accept:["julie","juli","julye","jolie","joli","july","julia","juliette"]}
};
const CEST = ["c'est","cest","s'est","ses","ces","sait","sais","sai","cet","c'","s'","cé","sé"];
const FILLERS = ["euh","heu","hum","hmm","ben","bah","mmm"];

/* Script structure (NIFDI part-firming handout):
   - Task: teacher wording that requires one learner response (or a system of closely related responses).
   - Part: a logically linked series of tasks. The more difficult the tasks, the smaller the part.
   - Exercise: a group of parts using the same teacher wording.
   - Model: teacher wording with no learner response (the introductory "spiel"). A model is not a task.
   Part-firming repeats tasks, never models: after a correction the part's tasks are repeated; a short
   exercise is gone through again as its test tasks; a delayed test gives a part's test tasks only.
   Task kinds: "lead" (learner says it with the teacher; microphone closed, not scored) and "test" (scored). */
const Q = ["C'est","qui ?"];
const A = who => ["C'est", PEOPLE[who].name + "."];
function Model(target, paulSide, o={}){ return Object.assign({type:"model", target, paulSide, questionUnits:Q, answerUnits:A(target)}, o); }
function Lead(id, target, paulSide){ return {type:"task", kind:"lead", id, target, paulSide, questionUnits:Q, answerUnits:A(target)}; }
function Test(id, target, paulSide, tag="new"){ return {type:"task", kind:"test", id, target, paulSide, tag, questionUnits:Q, answerUnits:A(target)}; }

const LESSONS = [{
  id:"L1",
  exercises:[{
    id:"L1E1", title:"C'est qui ?", track:"A",
    parts:[
      { id:"P1", label:"Introduction: Paul, then Julie", items:[
        Model("paul","L",{classroom:true, classLead:true}),   // first appearance; first "Avec moi" ever is shown in the classroom
        Lead("L1E1-T1","paul","L"),
        Test("L1E1-T2","paul","L"),
        Model("julie","L",{classroom:true}),                   // first appearance
        Lead("L1E1-T3","julie","L"),
        Test("L1E1-T4","julie","L") ]},
      { id:"P2", label:"Mixed test", items:[                    // each name in both frames; order not predictable
        Test("L1E1-T5","paul","R"),  Test("L1E1-T6","julie","R"),
        Test("L1E1-T7","julie","L"), Test("L1E1-T8","paul","L"),
        Test("L1E1-T9","julie","R") ]}
    ]
  }]
}];
const ORDER = LESSONS.flatMap(l=>l.exercises.map(e=>({lesson:l.id, ex:e.id})));   // every exercise, in course order
const nextExId = exId => { const i=ORDER.findIndex(o=>o.ex===exId); return i>=0 && i+1<ORDER.length ? ORDER[i+1].ex : null; };
const nextLessonId = lid => { const i=LESSONS.findIndex(l=>l.id===lid); return i>=0 && i+1<LESSONS.length ? LESSONS[i+1].id : null; };

/* ============================================================
   STATE — saved after every task; resume = start of the
   interrupted exercise (never mid-task).
   ============================================================ */
const KEY="frDI.v1";
const defaults = () => ({stateVer:4, lesson:0, ex:0, finished:{}, exHadError:{}, delayed:[], log:[], trace:[], ftc:{},
  settings:{caption:false, manual:false, voice:"", pause:550, rate:0.9}});
let S = defaults();
function load(){ try{ const raw=localStorage.getItem(KEY); if(raw){ const s=JSON.parse(raw); S=Object.assign(defaults(), s); S.settings=Object.assign(defaults().settings, s.settings||{});
  // version 2 of the saved state: scores from before 2026-11-07.5 came from listening faults, so progress restarts; the log is kept
  if(!s.stateVer || s.stateVer<4){ Object.assign(S,{lesson:0, ex:0, finished:{}, exHadError:{}, delayed:[], ftc:{}, stateVer:4});
    S.log.push({t:new Date().toISOString(), result:"PROGRESS RESET for version "+APP_VERSION+" (Exercise 1 redesigned)", heard:[]}); }
  } }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} renderPanel(); }

/* ============================================================
   SPEECH OUT — slow, unit by unit, French voice
   ============================================================ */
const synth = window.speechSynthesis;
let voices=[];
function pickVoices(){
  if(!synth) return;
  voices = synth.getVoices().filter(v=>/^fr/i.test(v.lang));
  voices.sort((a,b)=> score(b)-score(a));
  function score(v){ let s=0; if(/fr[-_]FR/i.test(v.lang)) s+=4; if(/google/i.test(v.name)) s+=3; if(/(amélie|amelie|thomas|audrey|denise|hortense|julie|marie)/i.test(v.name)) s+=2; if(v.localService===false) s+=1; return s; }
  renderVoiceSelect();
}
if(synth){ pickVoices(); synth.onvoiceschanged = pickVoices; }
function currentVoice(){ return voices.find(v=>v.name===S.settings.voice) || voices[0] || null; }
function groupVoice(){ const cv=currentVoice(); return voices.find(v=>v!==cv && /fr[-_]FR/i.test(v.lang)) || cv; }
const sleep = ms => new Promise(r=>setTimeout(r,ms));
let captionTimer=null;
function caption(text){ const c=document.getElementById("caption"); if(!S.settings.caption){c.hidden=true;return;} c.textContent=text; c.hidden=false; clearTimeout(captionTimer); captionTimer=setTimeout(()=>c.hidden=true, 2600); }
function speakOne(text, opts={}){
  return new Promise(res=>{
    if(!synth){ setTimeout(res, 400); return; }
    const u=new SpeechSynthesisUtterance(text.replace(/…/g,""));
    u.lang="fr-FR"; const v=opts.group? groupVoice() : currentVoice(); if(v) u.voice=v; u.rate=S.settings.rate;
    if(opts.group && v===currentVoice()) u.pitch=1.35;   // only one French voice: raise the pitch for the group
    let done=false; const fin=()=>{ if(!done){ done=true; res(); } };
    u.onend=fin; u.onerror=fin;
    setTimeout(fin, 900 + text.length*140);   // safety net: some browsers drop onend
    synth.speak(u);
  });
}
async function say(units, who="tutor"){

/* ============================================================
   SPEECH IN — French recognition, signalled by the green border
   ============================================================ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recogBroken = !SR;
const signalEl = document.getElementById("signal");
// The border is always shown. Brown: no response wanted. Green: respond now.
// "listen" = green with the microphone open; "lead" = green while the teacher says it with the learner,
// microphone closed so the app never hears its own voice; false = brown.
function signal(state){ signalEl.classList.toggle("on", state===true || state==="listen" || state==="lead"); }

function normalise(t){
  return t.toLowerCase().replace(/[’`]/g,"'").replace(/\bc est\b/g,"c'est").replace(/[.,!?;:«»"()\-…]/g," ").replace(/\s+/g," ").trim();
}
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; }
  return prev[n]; }
const fold = w => w.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/^g(?=[ie])/,"j");
// which name a word is: an exact listed form, or (closed set) clearly nearest one name, same first sound, at most 2 edits
function nameOf(w){
  for(const n of Object.keys(PEOPLE)) if(PEOPLE[n].accept.includes(w)) return {n, near:false};
  if(w.length<3 || CEST.includes(w)) return null;
  const f=fold(w); const d=Object.keys(PEOPLE).map(n=>({n, d:lev(f, fold(PEOPLE[n].name.toLowerCase()))})).sort((x,y)=>x.d-y.d);
  if(d[0].d<=2 && (d.length<2 || d[1].d>d[0].d) && f[0]===fold(PEOPLE[d[0].n].name.toLowerCase())[0]) return {n:d[0].n, near:true};
  return null;
}
function tokensOf(text){
  const toks = normalise(text).split(" ").filter(w=>w && !FILLERS.includes(w));
  const flat=[]; toks.forEach(w=>{ const m=w.match(/^([cs]')(.+)$/); if(m && !CEST.includes(w)) flat.push(m[1], m[2]); else flat.push(w); });
  return flat;
}
// remove the app's own recent words (picked up by the microphone), except anything that is or contains the answer
function stripEcho(toks, echoes){
  let t=toks.slice();
  for(const e of echoes){ if(!e.length) continue;
    for(let i=0;i+e.length<=t.length;){ if(e.every((w,k)=>t[i+k]===w)) t.splice(i,e.length); else i++; } }
  return t.filter((w,i)=> i===0 || w!==t[i-1]);   // a stutter ("c'est c'est") counts once
}
// judge: expected = [CEST, name] or [name]; returns {ok, reason, near}
function judge(text, expect, echoes=[], alsoOk=[]){
  const raw=tokensOf(text);
  if(!raw.length) return {ok:false, reason:"nothing heard"};
  const t=stripEcho(raw.filter((w,i)=> i===0 || w!==raw[i-1]), echoes);
  if(!t.length) return {ok:false, reason:"only the app's own words heard", echoOnly:true};
  const fits = want => { if(!t.length || t.length%want.length) return null; let near=[];
    for(let i=0;i<t.length;i++){ const e=want[i%want.length], w=t[i];
      if(e==="CEST"){ if(!CEST.includes(w)) return null; }
      else { const r=nameOf(w); if(!r || r.n!==e) return null; if(r.near) near.push(w); } }
    return near; };
  for(const want of [expect, ...alsoOk]){ const nr=fits(want); if(nr) return {ok:true, reason: nr.length? "accepted as near match: "+nr.join(", ") : "", near:nr.length>0}; }
  const target = expect[expect.length-1];
  const said = t.map(nameOf).filter(Boolean).map(r=>r.n);
  if(said.some(n=>n!==target)) return {ok:false, reason:"wrong name"};
  if(expect[0]==="CEST" && t.length===1 && said[0]===target) return {ok:false, reason:"name without c'est"};
  return {ok:false, reason:"not the expected words"};
}

let manualResolver=null;
// Everything the app says is remembered until the next listen, so its own words can be recognised if the microphone hears them.
let recentSaid=[];
let recGen=0, activeR=null;
function stopRec(){ recGen++; if(activeR){ try{ activeR.onresult=activeR.onend=activeR.onerror=activeR.onstart=null; activeR.abort(); }catch(e){} activeR=null; } }
async function synthIdle(){ const t=Date.now(); while(synth && (synth.speaking||synth.pending) && Date.now()-t<3000) await sleep(40); }
function listen(expect, alsoOk=[]){
  // an echo that is, contains, or is made only of parts of the answer is never removed
  const partOf = w => (expect.includes("CEST") && CEST.includes(w)) || (()=>{ const r=nameOf(w); return !!(r && expect.includes(r.n)); })();
  const echoes = recentSaid.map(u=>tokensOf(u)).filter(e=> e.length && !e.some(w=>{ const r=nameOf(w); return r && expect.includes(r.n); }) && !e.every(partOf));
  recentSaid=[];
  if(S.settings.manual || recogBroken){ signal("listen"); return listenManual(expect); }
  return new Promise(async resolve=>{
    stopRec();
    await synthIdle(); await sleep(350);          // the phone's own voice must have finished before the microphone opens
    const gen=++recGen;
    let R; try{ R=new SR(); }catch(e){ recogBroken=true; signal("listen"); resolve(listenManual(expect)); return; }
    activeR=R;
    R.lang="fr-FR"; R.continuous=true; R.interimResults=true; R.maxAlternatives=5;
    let t0=Date.now(), last=0, heardAny=false, finished=false, results=[], restarted=false, opened=false;
    const open=()=>{ if(opened) return; opened=true; t0=Date.now(); signal("listen"); trace("mic open"); };
    const cands=()=>{
      const segs=results.map(r=>Array.from(r).map(a=>a.transcript));
      if(!segs.length) return [];
      const out=[];
      // some phones (iPhone) repeat everything so far in each new result: the latest result alone is the whole answer
      segs[segs.length-1].forEach(a=>out.push(a));
      // others (Android Chrome) split the answer into segments: join them
      const top=segs.map(x=>x[0]).join(" "); out.push(top);
      segs.forEach((alts,i)=>alts.slice(1).forEach(a=>out.push(segs.map((x,j)=> j===i? a : x[0]).join(" "))));
      return [...new Set(out.map(x=>x.trim()))].filter(Boolean);
    };
    const best=()=>{ const c=cands(); for(const x of c){ const v=judge(x, expect, echoes, alsoOk); if(v.ok) return {c, v}; }
      return {c, v: c.length? judge(c[0], expect, echoes, alsoOk) : null}; };
    const finish=(status)=>{
      if(finished || gen!==recGen) return; finished=true; clearInterval(tick);
      stopRec(); signal(false);
      const {c, v} = best();
      let verdict = v || {ok:false, reason: status==="silence"?"no answer":"nothing heard"};
      const st = !c.length ? "silence" : (verdict.echoOnly ? "echo" : "heard");
      trace("mic closed: "+st);
      resolve({status: st, heard:c, ...verdict});
    };
    R.onstart=()=>{ if(gen===recGen) open(); };
    R.onresult=e=>{ if(gen!==recGen) return; open(); heardAny=true; last=Date.now(); results=Array.from(e.results); };
    R.onerror=e=>{ if(gen!==recGen) return; trace("recogniser error: "+e.error);
      if(e.error==="not-allowed"||e.error==="service-not-allowed"||e.error==="network"||e.error==="audio-capture"){ recogBroken=true; setStatus("Speech recognition unavailable ("+e.error+"). Switched to manual mode."); finished=true; clearInterval(tick); stopRec(); signal("listen"); resolve(listenManual(expect)); } };
    R.onend=()=>{ if(finished || gen!==recGen) return; if(!heardAny && !restarted && Date.now()-t0<6000){ restarted=true; try{R.start();}catch(e){finish("silence");} } else finish(heardAny?"heard":"silence"); };
    const tick=setInterval(()=>{
      if(!opened) return;
      const now=Date.now();
      if(heardAny){
        // slow learners pause between units: wait longer while the answer is still incomplete
        const matched=best().v?.ok;
        if(now-last > (matched? 700 : 2200)) finish("heard");
      } else if(now-t0 > 7000) finish("silence");
      if(now-t0 > 12000) finish(heardAny?"heard":"silence");
    },120);
    try{ R.start(); }catch(e){ finish("silence"); return; }
    setTimeout(()=>{ if(gen===recGen) open(); }, 300);   // if the phone never reports the start
  });
}
function listenManual(expect){
  const box=document.getElementById("manual"); box.hidden=false;
  const inp=document.getElementById("manualText"); inp.value=""; setTimeout(()=>inp.focus(),50);
  return new Promise(resolve=>{
    manualResolver=(kind, text)=>{
      manualResolver=null; box.hidden=true; signal(false);
      if(kind==="ok") resolve({status:"heard", heard:["(marked correct)"], ok:true, reason:""});
      else if(kind==="bad") resolve({status:"heard", heard:["(marked wrong)"], ok:false, reason:"marked wrong"});
      else if(kind==="silence") resolve({status:"silence", heard:[], ok:false, reason:"no answer"});
      else { const v=judge(text, expect); resolve({status:"heard", heard:[text], ...v}); }
    };
  });
}
document.getElementById("manualOk").onclick=()=>manualResolver&&manualResolver("ok");
document.getElementById("manualBad").onclick=()=>manualResolver&&manualResolver("bad");

let actx=null;
function audioUnlock(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){} }

  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0+dur+0.02); }

/* ============================================================
   ENGINE — Jon's flowchart, without individual turns
   ============================================================ */
// Only taught words are spoken. Restarting a part and opening a delayed test are
// shown with a symbol, not words (rubric 2h, A14).
const PHR = { ecoute:["Écoute."], atoi:["À toi."], avous:["À vous."], avecmoi:["Avec moi."] };
let ctx=null;   // {lesson, ex, delayedRec}
let phase="", curTask="";
function trace(ev){ (S.trace=S.trace||[]).push({t:new Date().toISOString(), task:curTask, phase, ev}); if(S.trace.length>4000) S.trace.splice(0, S.trace.length-4000); }
function ph(p){ phase=p; trace("phase: "+p); }
function logEntry(o){ S.log.push(Object.assign({t:new Date().toISOString()}, o)); if(S.log.length>2000) S.log.shift(); }

async function askAndListen(task, expect){
  await pointAt(task.target);
  await say(task.questionUnits);
  return listen(expect);
}
// Model (not a task): on an item's first appearance, the classroom with the model learner; otherwise a plain model
async function presentModel(m){
  curTask="model "+m.target;
  await setPortraits(m.paulSide);
  if(m.classroom){
    await setScene("class");
    ph("classroom model");
    await gestureEar(); await say(PHR.ecoute);
    await pointAt(m.target); await say(m.questionUnits); await sleep(250); await say(m.answerUnits);
    if(m.classLead){
      ph("classroom lead");
      await gestureLead(); await say(PHR.avecmoi); await pointAt(m.target); await say(m.questionUnits);
      glow(true); await sleep(250); await say(m.answerUnits, "both"); glow(false); rest(); await sleep(350);
    }
    ph("classroom test");
    await gesturePalm(); await say(PHR.atoi); await pointAt(m.target); await say(m.questionUnits);
    glow(true); await sleep(250); await say(m.answerUnits, "group"); glow(false); rest(); await sleep(400);
    await setScene("one");
  } else {
    ph("model");
    await gestureEar(); await say(PHR.ecoute);
    await pointAt(m.target); await say(m.questionUnits); await sleep(250); await say(m.answerUnits);
  }
  rest();
}
// Lead task: green border, the teacher says the answer with the learner; microphone closed, not scored
async function presentLead(t){
  curTask=t.id; await setPortraits(t.paulSide); ph("lead");
  await gestureLead(); await say(PHR.avecmoi); await pointAt(t.target); await say(t.questionUnits);
  signal("lead"); await sleep(250); await say(t.answerUnits); signal(false); rest(); await sleep(300);
  logEntry({lesson:ctx.lesson, ex:ctx.ex, part:ctx.part, task:t.id, phase:"lead", result:"lead (not scored)", heard:[], delayed:!!ctx.delayedRec});
}
// Test task. "À toi" comes first unless the previous item was also a test task (or a correction, which ends with it)
async function presentTest(t, {retest=false, firstSeen=null, atoi=true}={}){
  curTask=t.id; await setPortraits(t.paulSide);
  if(atoi){ await gesturePalm(); await say(PHR.atoi); }
  ph(retest? "retest" : "test");
  let r = await askAndListen(t, ["CEST", t.target]);
  if(r.status==="silence" || r.status==="echo"){   // once more, unscored, in case the microphone failed or heard only the app
    logEntry({lesson:ctx.lesson, ex:ctx.ex, part:ctx.part, task:t.id, phase, result:(r.status==="echo"?"only the app's own words heard":"silence")+" (repeated, unscored)", heard:r.heard.slice(0,6), delayed:!!ctx.delayedRec});
    r = await askAndListen(t, ["CEST", t.target]);
  }
  rest();
  const isFirst = firstSeen && !retest && !firstSeen.has(t.id);
  if(isFirst){ firstSeen.add(t.id);
    const f = (S.ftc[ctx.exKey] = S.ftc[ctx.exKey] || {new:{c:0,n:0}, review:{c:0,n:0}});
    f[t.tag].n++; if(r.ok) f[t.tag].c++; }
  logEntry({lesson:ctx.lesson, ex:ctx.ex, part:ctx.part, task:t.id, phase, expected:t.answerUnits.join(" "), heard:r.heard.slice(0,6),
            result:r.ok?"correct":"ERROR", reason:r.reason, first:!!isFirst, retest, delayed:!!ctx.delayedRec});
  save();
  if(r.ok) await ding();
  return r.ok;
}
async function correction(task, nth){
  ph("correction "+nth);
  await gestureEar(); await say(PHR.ecoute);                       // step 1: give the answer
  await pointAt(task.target); await say(task.answerUnits);
  if(nth>=2){                          // build from the end: narrator says the start, the green border cues the rest
    await say([task.answerUnits[0]+"…"]);
    ph("build from end");
    const r=await listen([task.target], [["CEST", task.target]]); rest();
    logEntry({lesson:ctx.lesson, ex:ctx.ex, part:ctx.part, task:task.id, phase, result:"build-from-end step "+(r.ok?"ok":"missed"), reason:r.reason, heard:r.heard.slice(0,6)});
    if(!r.ok){ await pointAt(task.target); await say(task.answerUnits); }
  }
  await gesturePalm(); await say(PHR.atoi);                        // step 2: repeat the task (presentTest asks the question)
}
// A part's error is recorded for its delayed tests: first at the end of the next exercise, then at the start of the next lesson.
function scheduleDelayed(part, anchor){
  const key=ctx.exKey.replace(" (delayed)","")+"/"+part.id;
  let d=S.delayed.find(x=>x.key===key);
  if(!d){ d={key, lesson:ctx.lesson, ex:ctx.ex, part:part.id, passed:0}; S.delayed.push(d); }
  d.passed=0;                                   // a failed delayed test starts the count again
  d.dueAfterEx = anchor.afterEx;                // run when this exercise has finished
  d.dueLessonStart = anchor.lessonStart;        // and when this lesson starts
  save();
}
// which items a run of a part presents
function itemsFor(part, run, shown){
  if(run==="first")  return part.items;                                            // models, leads and tests
  // after a correction: the part's tasks; a model only if the learner has not yet seen it (a later item's introduction)
  if(run==="repeat") return part.items.filter(it=>it.type==="task" || !shown.has(it));
  return part.items.filter(it=>it.type==="task" && it.kind==="test");               // "test": step 5 and delayed tests
}
async function runParts(parts, {run="first", firstSeen=new Set(), errorsByTask={}, anchor}={}){
  let hadError=false; const shown=new Set();
  for(const part of parts){
    let items=itemsFor(part, run, shown);
    if(!items.length) continue;
    ctx.part=part.id; trace("part "+part.id+" ("+run+"): "+part.label);
    let i=0, prevTest=false;
    while(i<items.length){
      const it=items[i];
      if(it.type==="model"){ await presentModel(it); shown.add(it); prevTest=false; i++; continue; }
      if(it.kind==="lead"){ await presentLead(it); prevTest=false; i++; continue; }
      const ok=await presentTest(it,{firstSeen, atoi:!prevTest}); prevTest=true;
      if(ok){ i++; continue; }
      hadError=true; scheduleDelayed(part, anchor);
      let fixed=false;
      while(!fixed){ errorsByTask[it.id]=(errorsByTask[it.id]||0)+1; await correction(it, errorsByTask[it.id]); fixed=await presentTest(it,{retest:true, atoi:false}); }
      // DISE correction step 6: before leaving a corrected statement, the learner hears it said correctly once more
      ph("final confirmation"); await pointAt(it.target); await say(it.answerUnits); rest();
      // NIFDI step 3: go back and repeat the part (its tasks, not its models); it is firm when it runs with no errors
      await flashIcon("restart");
      items = itemsFor(part, run==="first" ? "repeat" : run, shown); i=0; prevTest=false;
    }
  }
  return hadError;
}
async function runExercise(li, ei){
  const lesson=LESSONS[li], ex=lesson.exercises[ei];
  ctx={lesson:lesson.id, ex:ex.id, exKey:ex.id, delayedRec:null, part:null};
  S.lesson=li; S.ex=ei; save();
  paulSide=null;
  const anchor={afterEx: nextExId(ex.id), lessonStart: nextLessonId(lesson.id)};
  const firstSeen=new Set(), errorsByTask={};
  let hadError = await runParts(ex.parts, {firstSeen, errorsByTask, anchor});
  if(hadError){
    // NIFDI step 5: a short exercise with an error is gone through again from the beginning, as its test tasks (no models)
    ph("exercise again (step 5)"); trace("step 5: exercise again from the beginning");
    await flashIcon("restart");
    await runParts(ex.parts, {run:"test", firstSeen, errorsByTask, anchor});
  }
  S.exHadError[ex.id]=hadError; S.finished[ex.id]=true; save();
}
// a delayed test: the part's test tasks, opened with the bookmark symbol. Passed when it runs with no error;
// an error resets the count and schedules it again (end of the next exercise, start of the next lesson).
async function runDelayed(d, anchor){
  const lesson=LESSONS.find(l=>l.id===d.lesson); const ex=lesson && lesson.exercises.find(e=>e.id===d.ex);
  const part=ex && ex.parts.find(p=>p.id===d.part); if(!part){ S.delayed=S.delayed.filter(x=>x!==d); save(); return; }
  ctx={lesson:d.lesson, ex:d.ex, exKey:d.ex+" (delayed)", delayedRec:d, part:part.id};
  paulSide=null;
  await flashIcon("bookmark");
  trace("delayed test "+d.key+" (passed so far "+(d.passed||0)+")");
  const hadError = await runParts([part], {run:"test", anchor});
  if(!hadError){ d.passed=(d.passed||0)+1; if(d.passed>=2) S.delayed=S.delayed.filter(x=>x!==d); }
  save();
}

async function main(){
  const lesson=LESSONS[S.lesson];
  // start of a lesson: delayed tests due at the start of this lesson
  if(S.ex===0 && !S.finished[lesson.exercises[0].id]){
    for(const d of S.delayed.filter(x=>x.dueLessonStart===lesson.id)){ d.dueLessonStart=null; await runDelayed(d, {afterEx: lesson.exercises[0].id, lessonStart: nextLessonId(lesson.id)}); }
  }
  for(let ei=S.ex; ei<lesson.exercises.length; ei++){
    const exId=lesson.exercises[ei].id;
    if(!S.finished[exId]) await runExercise(S.lesson, ei);
    // end of an exercise: delayed tests due after it (also catches any left over if the app was closed here)
    for(const d of S.delayed.filter(x=>x.dueAfterEx===exId)){ d.dueAfterEx=null; await runDelayed(d, {afterEx: nextExId(exId), lessonStart: nextLessonId(lesson.id)}); }
  }
  await endScreen();
}
async function endScreen(){
  rest();
  document.getElementById("tick").style.opacity=1;
  await ding(true);
  await sleep(1200);
  document.getElementById("tick").style.opacity=0;
  showPlay(true);
}

/* ============================================================
   START / RESUME
   ============================================================ */
let running=false;
function showPlay(on){ document.getElementById("play").hidden=!on; }
document.getElementById("playBtn").onclick=async ()=>{
  if(running) return; running=true; showPlay(false);
  if(synth){ try{ synth.cancel(); synth.speak(new SpeechSynthesisUtterance("")); }catch(e){} }  // unlock audio on mobile
  audioUnlock();
  const lesson=LESSONS[S.lesson];
  if(lesson.exercises.every(e=>S.finished[e.id])){   // prototype has one exercise: replay it
    lesson.exercises.forEach(e=>delete S.finished[e.id]); S.ex=0; save();
  }
  try{ await main(); } finally { running=false; }
};

function setStatus(msg){ $("status").dataset.msg=msg; renderPanel(); }
function renderVoiceSelect(){
  if(!READY) return;
  const sel=$("optVoice"); if(!sel) return;
  sel.innerHTML = voices.length ? voices.map(v=>`<option value="${v.name}">${v.name} (${v.lang})</option>`).join("") : `<option>No French voice found</option>`;
  const cv=currentVoice(); if(cv) sel.value=cv.name;
  renderPanel();
}
function renderPanel(){
  if(!READY) return;
  if(!$("status")) return;
  const cv=currentVoice();
  $("status").innerHTML = `Version ${APP_VERSION} · Speech recognition: <b>${SR? (recogBroken? "unavailable": "available (fr-FR)") : "not supported in this browser"}</b> · Voice: <b>${cv?cv.name:"none"}</b>` + ($("status").dataset.msg? `<br>${$("status").dataset.msg}`:"");
  if(S.learnerGender) $("optGender").value=S.learnerGender;
  $("optCaption").checked=S.settings.caption; $("optManual").checked=S.settings.manual;
  $("optPause").value=S.settings.pause; $("pauseVal").textContent=S.settings.pause;
  $("optRate").value=S.settings.rate; $("rateVal").textContent=S.settings.rate;
  const L=LESSONS[S.lesson];
  $("progress").innerHTML = `Lesson ${S.lesson+1}, resume point: Exercise ${S.ex+1} (${L.exercises[S.ex].title}) — ${S.finished[L.exercises[S.ex].id]?"finished":"not finished"}.`;
  const rows=Object.entries(S.ftc).map(([k,f])=>{
    const cell=(x,crit)=> x.n? `<span class="${x.c/x.n*100>=crit?'ok':'bad'}">${Math.round(x.c/x.n*100)}% (${x.c}/${x.n})</span>` : "—";
    return `<tr><td>${k}</td><td>${cell(f.new,70)}</td><td>${cell(f.review,90)}</td></tr>`; }).join("");
  $("ftc").innerHTML = rows? `<table><tr><th>Exercise</th><th>New (≥70%)</th><th>Review (≥90%)</th></tr>${rows}</table>` : `<span class="note">No data yet.</span>`;
  $("delayedList").textContent = S.delayed.length? S.delayed.map(d=>`${d.key} — passed ${d.passed||0}/2; due after ${d.dueAfterEx||"—"}, at start of ${d.dueLessonStart||"—"}`).join("; ") : "None.";
  const recent=S.log.slice(-200).reverse();
  $("log").innerHTML = recent.length? `<table><tr><th>Task</th><th>Result</th><th>Heard</th></tr>${recent.map(e=>`<tr><td>${e.task||""}${e.phase?" · "+e.phase:""}${e.retest?" (retest)":""}${e.delayed?" (delayed)":""}</td><td class="${e.result==='correct'?'ok':(String(e.result).startsWith('ERROR')?'bad':'')}">${e.result}${e.reason? " — "+e.reason:""}</td><td>${(e.heard||[]).map(h=>String(h).replace(/</g,"&lt;")).join(" | ")}</td></tr>`).join("")}</table>` : "";
}
$("flag").onclick=()=>{ logEntry({task:curTask, phase, result:"TESTER FLAG", heard:[]}); trace("tester flag"); save();
  $("flag").classList.add("hit"); setTimeout(()=>$("flag").classList.remove("hit"), 600); };
$("gear").onclick=()=>{ $("panel").hidden=false; renderPanel(); };
$("closePanel").onclick=()=>{ $("panel").hidden=true; };
$("optGender").onchange=e=>{ S.learnerGender=e.target.value; save(); };
$("optCaption").onchange=e=>{ S.settings.caption=e.target.checked; save(); };
$("optManual").onchange=e=>{ S.settings.manual=e.target.checked; save(); };
$("optVoice").onchange=e=>{ S.settings.voice=e.target.value; save(); };
$("optPause").oninput=e=>{ S.settings.pause=+e.target.value; save(); };
$("optRate").oninput=e=>{ S.settings.rate=+e.target.value; save(); };
$("btnRestartEx").onclick=()=>{ if(running) return alertish("Wait until the exercise ends, or reload the page."); const L=LESSONS[S.lesson]; delete S.finished[L.exercises[S.ex].id]; save(); $("panel").hidden=true; };
$("btnDelayed").onclick=async ()=>{ if(running||!S.delayed.length) return; running=true; $("panel").hidden=true; showPlay(false); try{ for(const d of [...S.delayed]) await runDelayed(d, {afterEx:null, lessonStart:null}); await endScreen(); } finally{ running=false; } };
$("btnReset").onclick=()=>{ if(running) return; const keep=S.settings; S=defaults(); S.settings=keep; save(); };
$("btnDownload").onclick=()=>{ const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="french-di-log.json"; document.body.appendChild(a); a.click(); a.remove(); };
function alertish(m){ setStatus(m); }

READY=true; load(); renderVoiceSelect(); renderPanel(); rest();

setPortraits(LESSONS[S.lesson].exercises[S.ex].parts[0].items[0].paulSide);
window.__app={get S(){return S}, judge, LESSONS, pointAt, gestureEar, gesturePalm, thumbsUp, signal, setPortraits, rest, thumb, flashIcon, setScene, gestureLead};
